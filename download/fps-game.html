<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Game - نسخه تست</title>
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body { overflow: hidden; background: #000; font-family: Tahoma, Arial, sans-serif; }
	canvas { display: block; }

	#blocker {
		position: fixed; inset: 0;
		background: rgba(0,0,0,0.7);
		display: flex; align-items: center; justify-content: center;
		z-index: 100;
		cursor: pointer;
	}

	#instructions {
		text-align: center;
		color: #fff;
		direction: ltr;
	}

	#instructions h1 {
		font-size: 36px;
		margin-bottom: 20px;
		color: #4fc3f7;
	}

	#instructions p {
		font-size: 18px;
		margin: 8px 0;
		color: #ccc;
	}

	#instructions .key {
		display: inline-block;
		background: #333;
		border: 1px solid #555;
		border-radius: 5px;
		padding: 2px 10px;
		font-family: monospace;
		font-size: 16px;
		color: #4fc3f7;
	}

	#crosshair {
		position: fixed;
		top: 50%; left: 50%;
		transform: translate(-50%, -50%);
		z-index: 50;
		pointer-events: none;
	}

	#crosshair::before, #crosshair::after {
		content: '';
		position: absolute;
		background: rgba(255,255,255,0.7);
	}

	#crosshair::before {
		width: 20px; height: 2px;
		top: -1px; left: -10px;
	}

	#crosshair::after {
		width: 2px; height: 20px;
		top: -10px; left: -1px;
	}

	#debug {
		position: fixed;
		top: 10px; left: 10px;
		color: #0f0;
		font-family: monospace;
		font-size: 14px;
		z-index: 50;
		pointer-events: none;
		direction: ltr;
		text-align: left;
	}
</style>
</head>
<body>

<div id="blocker">
	<div id="instructions">
		<h1>FPS Game</h1>
		<p>Click to Play</p>
		<p>
			<span class="key">W</span>
			<span class="key">A</span>
			<span class="key">S</span>
			<span class="key">D</span> Move
		</p>
		<p>
			<span class="key">Mouse</span> Look Around
		</p>
		<p>
			<span class="key">ESC</span> Pause
		</p>
	</div>
</div>

<div id="crosshair"></div>
<div id="debug"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== CONFIG =====
const MOUSE_SENSITIVITY = 0.002;
const MOVE_SPEED = 8;
const PLAYER_HEIGHT = 1.7;
const GRAVITY = 20;

// ===== STATE =====
let isLocked = false;
let yaw = 0;    // horizontal rotation (radians)
let pitch = 0;  // vertical rotation (radians)
let velocityY = 0;
const keys = { w: false, a: false, s: false, d: false };

// ===== THREE.JS SETUP =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Player container (yaw rotates this)
const player = new THREE.Object3D();
player.position.set(0, PLAYER_HEIGHT, 0);
scene.add(player);

// Pitch container (child of player, camera goes here)
const pitchObject = new THREE.Object3D();
player.add(pitchObject);
pitchObject.add(camera);

camera.position.set(0, 0, 0);

// ===== LIGHTING =====
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -40;
dirLight.shadow.camera.right = 40;
dirLight.shadow.camera.top = 40;
dirLight.shadow.camera.bottom = -40;
scene.add(dirLight);

// ===== GROUND =====
const groundGeo = new THREE.PlaneGeometry(100, 100, 20, 20);
const groundMat = new THREE.MeshStandardMaterial({
	color: 0x4a7c3f,
	roughness: 0.9,
	metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper
const grid = new THREE.GridHelper(100, 50, 0x000000, 0x2a5c1f);
scene.add(grid);

// ===== REFERENCE OBJECTS =====
const objects = [];

function createBox(x, y, z, w, h, d, color) {
	const geo = new THREE.BoxGeometry(w, h, d);
	const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.1 });
	const mesh = new THREE.Mesh(geo, mat);
	mesh.position.set(x, y, z);
	mesh.castShadow = true;
	mesh.receiveShadow = true;
	scene.add(mesh);
	objects.push(mesh);
	return mesh;
}

// Colored boxes around the player for visual reference
createBox(0, 0.75, -8, 1.5, 1.5, 1.5, 0xe74c3c);   // Red box ahead
createBox(-6, 1, -4, 2, 2, 2, 0x3498db);     // Blue box left
createBox(6, 0.5, -6, 1, 1, 4, 0xf39c12);     // Orange wall right
createBox(0, 1.5, 8, 3, 3, 3, 0x9b59b6);      // Purple box behind
createBox(-4, 0.5, 5, 1, 1, 1, 0x1abc9c);     // Teal box
createBox(8, 2, 3, 2, 4, 2, 0xe67e22);       // Dark orange tall box
createBox(-8, 0.75, -10, 1.5, 1.5, 1.5, 0x2ecc71); // Green box far left
createBox(5, 1, 10, 2, 2, 1, 0xe84393);      // Pink box

// Ramp
const rampGeo = new THREE.BoxGeometry(4, 0.3, 6);
const rampMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.7 });
const ramp = new THREE.Mesh(rampGeo, rampMat);
ramp.position.set(-3, 0.7, -2);
ramp.rotation.x = -0.2;
ramp.castShadow = true;
ramp.receiveShadow = true;
scene.add(ramp);
objects.push(ramp);

// Some cylinders
function createCylinder(x, y, z, radius, height, color) {
	const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
	const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
	const mesh = new THREE.Mesh(geo, mat);
	mesh.position.set(x, y, z);
	mesh.castShadow = true;
	mesh.receiveShadow = true;
	scene.add(mesh);
	objects.push(mesh);
}

createCylinder(10, 1, -5, 0.5, 2, 0xc0392b);
createCylinder(-10, 1.5, 5, 0.7, 3, 0x2980b9);
createCylinder(3, 0.75, -12, 0.75, 1.5, 0x27ae60);

// ===== POINTER LOCK =====
const blocker = document.getElementById('blocker');

document.addEventListener('click', function() {
	renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', function() {
	if (document.pointerLockElement === renderer.domElement) {
		isLocked = true;
		blocker.style.display = 'none';
	} else {
		isLocked = false;
		blocker.style.display = 'flex';
	}
});

// ===== MOUSE LOOK =====
document.addEventListener('mousemove', function(event) {
	if (!isLocked) return;

	const movementX = event.movementX || 0;
	const movementY = event.movementY || 0;

	yaw -= movementX * MOUSE_SENSITIVITY;
	pitch -= movementY * MOUSE_SENSITIVITY;
	pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));

	player.rotation.y = yaw;
	pitchObject.rotation.x = pitch;
});

// ===== KEYBOARD =====
document.addEventListener('keydown', function(event) {
	switch(event.code) {
		case 'KeyW': keys.w = true; break;
		case 'KeyA': keys.a = true; break;
		case 'KeyS': keys.s = true; break;
		case 'KeyD': keys.d = true; break;
	}
});

document.addEventListener('keyup', function(event) {
	switch(event.code) {
		case 'KeyW': keys.w = false; break;
		case 'KeyA': keys.a = false; break;
		case 'KeyS': keys.s = false; break;
		case 'KeyD': keys.d = false; break;
	}
});

// ===== RESIZE =====
window.addEventListener('resize', function() {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== GAME LOOP =====
const clock = new THREE.Clock();
const debugEl = document.getElementById('debug');

function animate() {
	requestAnimationFrame(animate);
	const delta = Math.min(clock.getDelta(), 0.05);

	if (isLocked) {
		// Movement direction based on player yaw
		const forward = new THREE.Vector3(0, 0, -1);
		const right = new THREE.Vector3(1, 0, 0);
		forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
		right.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

		const moveDir = new THREE.Vector3(0, 0, 0);
		if (keys.w) moveDir.add(forward);
		if (keys.s) moveDir.sub(forward);
		if (keys.d) moveDir.add(right);
		if (keys.a) moveDir.sub(right);

		if (moveDir.lengthSq() > 0) {
			moveDir.normalize();
		}

		player.position.x += moveDir.x * MOVE_SPEED * delta;
		player.position.z += moveDir.z * MOVE_SPEED * delta;

		// Gravity (simple)
		velocityY -= GRAVITY * delta;
		player.position.y += velocityY * delta;
		if (player.position.y <= PLAYER_HEIGHT) {
			player.position.y = PLAYER_HEIGHT;
			velocityY = 0;
		}

		// Debug info
		debugEl.innerHTML =
			'Pos: ' + player.position.x.toFixed(1) + ', ' + player.position.y.toFixed(1) + ', ' + player.position.z.toFixed(1) + '<br>' +
			'Yaw: ' + (yaw * 180 / Math.PI).toFixed(1) + '°  ' +
			'Pitch: ' + (pitch * 180 / Math.PI).toFixed(1) + '°';
	}

	renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
