<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#fff;user-select:none}
canvas{display:block}

/* ===== MENU SYSTEM ===== */
.menu-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:url('https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/c021ed7594c0.png') center/cover no-repeat}
.menu-overlay::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.65)}
.menu-overlay.hidden{display:none}
.menu-content{position:relative;z-index:1;text-align:center;direction:ltr}
#main-menu h1{font-size:52px;font-weight:900;letter-spacing:6px;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 30px rgba(79,195,247,0.5);color:#4fc3f7}
#main-menu .subtitle{font-size:14px;color:#aaa;margin-bottom:40px;letter-spacing:3px}

.menu-btn{display:block;width:280px;margin:12px auto;padding:14px 0;background:rgba(255,255,255,0.08);border:1px solid rgba(79,195,247,0.3);border-radius:8px;color:#fff;font-size:18px;font-weight:600;cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s}
.menu-btn:hover{background:rgba(79,195,247,0.2);border-color:#4fc3f7;transform:scale(1.04);box-shadow:0 0 20px rgba(79,195,247,0.3)}
.menu-btn:active{transform:scale(0.98)}
.menu-btn.back-btn{font-size:14px;width:200px;margin-top:30px;background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.15)}

/* Map Select */
#map-menu h2{font-size:36px;margin-bottom:30px;color:#4fc3f7;letter-spacing:3px}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto}
.map-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:20px;cursor:pointer;transition:all 0.3s;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.map-card:hover{border-color:#4fc3f7;background:rgba(79,195,247,0.1);transform:translateY(-3px)}
.map-card.locked{opacity:0.4;cursor:not-allowed;pointer-events:none}
.map-card .map-icon{font-size:36px;margin-bottom:10px}
.map-card .map-name{font-size:16px;font-weight:700;letter-spacing:1px}
.map-card .map-status{font-size:12px;color:#888;margin-top:6px;letter-spacing:1px}
.map-card.playable .map-status{color:#4fc3f7}

/* Settings */
#settings-menu .menu-content{max-width:400px}
#settings-menu h2{font-size:36px;margin-bottom:30px;color:#4fc3f7;letter-spacing:3px}
.setting-group{margin:20px 0;text-align:left}
.setting-label{font-size:14px;color:#aaa;margin-bottom:8px;letter-spacing:1px}
.setting-row{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;flex:1;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#4fc3f7;border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(79,195,247,0.5)}
.setting-value{font-size:14px;color:#4fc3f7;min-width:35px;text-align:right;font-weight:700}
.lang-btns{display:flex;gap:10px}
.lang-btn{flex:1;padding:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#aaa;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s}
.lang-btn.active{background:rgba(79,195,247,0.2);border-color:#4fc3f7;color:#4fc3f7}
.lang-btn:hover{border-color:#4fc3f7}

/* HUD */
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.7)}
#crosshair::before{width:20px;height:2px;top:-1px;left:-10px}
#crosshair::after{width:2px;height:20px;top:-10px;left:-1px}
#debug{position:fixed;top:10px;left:10px;color:#0f0;font-family:monospace;font-size:13px;z-index:50;pointer-events:none;direction:ltr;text-align:left}

/* Muzzle flash */
#muzzle-flash{position:fixed;top:50%;left:50%;width:60px;height:60px;transform:translate(-50%,-30%);z-index:45;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,220,80,0.9),rgba(255,120,0,0.5),transparent 70%);border-radius:50%}
#muzzle-flash.fire{animation:flash 0.08s ease-out}
@keyframes flash{0%{opacity:1;transform:translate(-50%,-30%) scale(1)}100%{opacity:0;transform:translate(-50%,-30%) scale(1.5)}}

/* Gun recoil handled in JS */

/* Pause */
#pause-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column}
#pause-overlay.hidden{display:none}
#pause-overlay h2{font-size:40px;color:#4fc3f7;margin-bottom:20px;letter-spacing:4px}
#pause-overlay p{color:#aaa;font-size:16px}

/* RTL for Persian */
[dir=rtl] .menu-content{direction:rtl}
[dir=rtl] .setting-group{text-align:right}
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="main-menu" class="menu-overlay">
<div class="menu-content">
<h1 id="t_title" data-en="FPS GAME" data-fa="بازی شوتر">FPS GAME</h1>
<p class="subtitle" id="t_subtitle" data-en="SHOOTER EXPERIENCE" data-fa="تجربه تیراندازی">SHOOTER EXPERIENCE</p>
<button class="menu-btn" onclick="startGame()" data-en="START GAME" data-fa="شروع بازی">START GAME</button>
<button class="menu-btn" onclick="showMenu('map-menu')" data-en="SELECT MAP" data-fa="انتخاب نقشه">SELECT MAP</button>
<button class="menu-btn" onclick="showMenu('settings-menu')" data-en="SETTINGS" data-fa="تنظیمات">SETTINGS</button>
</div>
</div>

<!-- MAP SELECT -->
<div id="map-menu" class="menu-overlay hidden">
<div class="menu-content">
<h2 data-en="SELECT MAP" data-fa="انتخاب نقشه">SELECT MAP</h2>
<div class="map-grid">
<div class="map-card playable" onclick="selectMap(0)"><div class="map-icon">🏗️</div>
<div class="map-name">Test Map</div>
<div class="map-status" data-en="PLAYABLE" data-fa="آماده بازی">PLAYABLE</div>
</div>
<div class="map-card playable" onclick="selectMap(1)">
<div class="map-icon">🏗️</div>
<div class="map-name" data-en="Vertigo" data-fa="ورتیگو">Vertigo</div>
<div class="map-status" data-en="PLAYABLE" data-fa="آماده بازی">PLAYABLE</div>
</div>
<div class="map-card playable" onclick="selectMap(2)">
<div class="map-icon">🏜️</div>
<div class="map-name" data-en="Dust" data-fa="داست">Dust</div>
<div class="map-status" data-en="PLAYABLE" data-fa="آماده بازی">PLAYABLE</div>
</div>
<div class="map-card playable" onclick="selectMap(3)">
<div class="map-icon">💥</div>
<div class="map-name" data-en="Shoot" data-fa="شوت">Shoot</div>
<div class="map-status" data-en="PLAYABLE" data-fa="آماده بازی">PLAYABLE</div>
</div>
</div>
<button class="menu-btn back-btn" onclick="showMenu('main-menu')" data-en="BACK" data-fa="بازگشت">BACK</button>
</div>
</div>

<!-- SETTINGS -->
<div id="settings-menu" class="menu-overlay hidden">
<div class="menu-content">
<h2 data-en="SETTINGS" data-fa="تنظیمات">SETTINGS</h2>
<div class="setting-group">
<div class="setting-label" data-en="MOUSE SENSITIVITY" data-fa="حساسیت ماوس">MOUSE SENSITIVITY</div>
<div class="setting-row">
<input type="range" id="sens-slider" min="1" max="20" value="4" oninput="updateSens(this.value)">
<span class="setting-value" id="sens-val">0.004</span>
</div>
</div>
<div class="setting-group">
<div class="setting-label" data-en="MASTER VOLUME" data-fa="صدای کلی">MASTER VOLUME</div>
<div class="setting-row">
<input type="range" id="vol-slider" min="0" max="100" value="70" oninput="updateVol(this.value)">
<span class="setting-value" id="vol-val">70%</span>
</div>
</div>
<div class="setting-group">
<div class="setting-label" data-en="LANGUAGE / زبان" data-fa="LANGUAGE / زبان">LANGUAGE / زبان</div>
<div class="lang-btns">
<button class="lang-btn active" id="lang-en" onclick="setLang('en')">English</button>
<button class="lang-btn" id="lang-fa" onclick="setLang('fa')">فارسی</button>
</div>
</div>
<button class="menu-btn back-btn" onclick="showMenu('main-menu')" data-en="BACK" data-fa="بازگشت">BACK</button>
</div>
</div>

<!-- PAUSE -->
<div id="pause-overlay" class="hidden">
<h2 data-en="PAUSED" data-fa="توقف">PAUSED</h2>
<p data-en="Click to resume" data-fa="کلیک کنید برای ادامه">Click to resume</p>
</div>

<!-- GAME HUD -->
<div id="crosshair" style="display:none"></div>
<div id="muzzle-flash"></div>
<div id="debug" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== CONFIG =====
let MOUSE_SENS = 0.004;
let masterVolume = 0.7;
const MOVE_SPEED = 8;
const PLAYER_HEIGHT = 1.7;
const GRAVITY = 20;
let isLocked = false;
let gameStarted = false;
let yaw = 0, pitch = 0;
let velocityY = 0;
const keys = {w:false,a:false,s:false,d:false};
let isMoving = false;
let footstepTimer = 0;
const FOOTSTEP_INTERVAL = 0.45;
let canShoot = true;
let ammo = 30;
let maxAmmo = 30;
let recoilAmount = 0;

// ===== AUDIO SYSTEM (Web Audio API) =====
let audioCtx = null;
let gunAudioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playFootstep() {
  ensureAudio();
  const vol = masterVolume * 0.3;
  if (vol <= 0) return;
  // Create short noise burst for footstep
  const bufferSize = audioCtx.sampleRate * 0.08;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start();
}

function playGunshot() {
  ensureAudio();
  const vol = masterVolume * 0.6;
  if (vol <= 0) return;
  const dur = 0.15;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const t = i / audioCtx.sampleRate;
    data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 30) * 1.5;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  // Low thump
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(vol * 0.8, audioCtx.currentTime);
  oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  // Noise part
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(vol, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1000;
  filter.Q.value = 0.5;
  src.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  osc.connect(oscGain).connect(audioCtx.destination);
  src.start();
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// ===== TRANSLATIONS =====
let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.getElementById('lang-fa').classList.toggle('active', lang==='fa');
  document.querySelectorAll('[data-'+lang+']').forEach(el => {
    el.textContent = el.getAttribute('data-'+lang);
  });
}

function showMenu(id) {
  document.querySelectorAll('.menu-overlay').forEach(m => m.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function selectMap(idx) { currentMap = idx; startGame(); }

function updateSens(v) {
  MOUSE_SENS = v * 0.001;
  document.getElementById('sens-val').textContent = MOUSE_SENS.toFixed(3);
}

function updateVol(v) {
  masterVolume = v / 100;
  document.getElementById('vol-val').textContent = v + '%';
}

// ===== THREE.JS SETUP =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '1';
document.body.appendChild(renderer.domElement);

const player = new THREE.Object3D();
player.position.set(0, PLAYER_HEIGHT, 0);
scene.add(player);

const pitchObj = new THREE.Object3D();
player.add(pitchObj);
pitchObj.add(camera);
camera.position.set(0,0,0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048,2048);
const sc = dirLight.shadow.camera;
sc.near=0.5;sc.far=80;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;
scene.add(dirLight);

// ===== MAP SYSTEM =====
const mapGroup = new THREE.Group();
scene.add(mapGroup);
const sceneObjects = [];
let currentMap = 0;

function clearMap() {
  while(mapGroup.children.length > 0) {
    const child = mapGroup.children[0];
    mapGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  }
  sceneObjects.length = 0;
}

function addBox(x,y,z,w,h,d,c) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:c,roughness:0.5,metalness:0.1}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  mapGroup.add(m); sceneObjects.push(m); return m;
}

function addCyl(x,y,z,r,h,c,roughness) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),
    new THREE.MeshStandardMaterial({color:c,roughness:roughness||0.4,metalness:0.3}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  mapGroup.add(m); sceneObjects.push(m); return m;
}

function setGround(color, gridColor1, gridColor2) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({color:color,roughness:0.9}));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true;
  mapGroup.add(g);
  mapGroup.add(new THREE.GridHelper(100, 50, gridColor1, gridColor2));
}

function addRamp(x,y,z,w,h,d,ry,rx,c) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
  m.position.set(x,y,z); m.rotation.set(rx||-0.2,ry||0,0);
  m.castShadow=true; m.receiveShadow=true;
  mapGroup.add(m); sceneObjects.push(m); return m;
}

function addArch(x,y,z,spanW,height,thickness,color) {
  addBox(x-spanW/2+thickness/2, y+height/2, z, thickness, height, thickness, color);
  addBox(x+spanW/2-thickness/2, y+height/2, z, thickness, height, thickness, color);
  addBox(x, y+height, z, spanW, thickness*0.8, thickness, color);
}

function addWall(x,y,z,w,h,d,c) { return addBox(x,y,z,w,h,d,c); }

// ===== MAPS =====
function loadTestMap() {
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 30, 100);
  setGround(0x4a7c3f, 0x000000, 0x2a5c1f);
  addBox(0,0.75,-8,1.5,1.5,1.5,0xe74c3c);
  addBox(-6,1,-4,2,2,2,0x3498db);
  addBox(6,0.5,-6,1,1,4,0xf39c12);
  addBox(0,1.5,8,3,3,3,0x9b59b6);
  addBox(-4,0.5,5,1,1,1,0x1abc9c);
  addBox(8,2,3,2,4,2,0xe67e22);
  addBox(-8,0.75,-10,1.5,1.5,1.5,0x2ecc71);
  addBox(5,1,10,2,2,1,0xe84393);
  addCyl(10,1,-5,0.5,2,0xc0392b);
  addCyl(-10,1.5,5,0.7,3,0x2980b9);
  addCyl(3,0.75,-12,0.75,1.5,0x27ae60);
}

function loadVertigoMap() {
  scene.background = new THREE.Color(0x6699cc);
  scene.fog = new THREE.Fog(0x6699cc, 40, 120);
  setGround(0x555566, 0x333344, 0x444455);
  const M = 0x667788; // metal
  const D = 0x444455; // dark
  const Y = 0xccaa44; // yellow warning
  // === MAIN PLATFORM (A site) ===
  addWall(0, 0.15, -12, 24, 0.3, 18, M); // floor slab
  // Edge walls
  addWall(0, 2, -20.5, 24, 4, 0.5, D);
  addWall(0, 2, -3.5, 24, 4, 0.5, D);
  addWall(-12.25, 2, -12, 0.5, 4, 18, D);
  addWall(12.25, 2, -12, 0.5, 4, 18, D);
  // Scaffolding pillars
  addCyl(-10, 2, -18, 0.15, 4, M, 0.2);
  addCyl(-5, 2, -18, 0.15, 4, M, 0.2);
  addCyl(0, 2, -18, 0.15, 4, M, 0.2);
  addCyl(5, 2, -18, 0.15, 4, M, 0.2);
  addCyl(10, 2, -18, 0.15, 4, M, 0.2);
  addCyl(-10, 2, -6, 0.15, 4, M, 0.2);
  addCyl(-5, 2, -6, 0.15, 4, M, 0.2);
  addCyl(0, 2, -6, 0.15, 4, M, 0.2);
  addCyl(5, 2, -6, 0.15, 4, M, 0.2);
  addCyl(10, 2, -6, 0.15, 4, M, 0.2);
  // Cross beams
  addWall(-7.5, 3.8, -18, 7, 0.2, 0.2, D);
  addWall(2.5, 3.8, -18, 7, 0.2, 0.2, D);
  addWall(-7.5, 2.5, -18, 7, 0.2, 0.2, D);
  addWall(2.5, 2.5, -18, 7, 0.2, 0.2, D);
  addWall(-7.5, 3.8, -6, 7, 0.2, 0.2, D);
  addWall(2.5, 3.8, -6, 7, 0.2, 0.2, D);
  // Crates on A site
  addBox(-6, 0.75, -16, 1.5, 1.5, 1.5, 0x8b6914);
  addBox(-4.5, 0.75, -16, 1.5, 1.5, 1.5, 0x8b6914);
  addBox(-5.25, 2.15, -16, 1.2, 1, 1.2, 0x9b7924);
  addBox(7, 0.5, -14, 1, 1, 2, 0x8b6914);
  addBox(7, 1.4, -14, 0.8, 0.8, 1.6, 0x9b7924);
  addBox(2, 0.75, -9, 1.5, 1.5, 1.5, 0x8b6914);
  addBox(-8, 0.5, -10, 2, 1, 1, 0x8b6914);
  // === CONNECTOR BRIDGE ===
  addWall(0, 0.15, 0, 6, 0.3, 12, M);
  addWall(0, 2, -5.5, 6, 4, 0.5, D);
  addWall(0, 2, 5.5, 6, 4, 0.5, D);
  addWall(-3.25, 2, 0, 0.5, 4, 12, D);
  addWall(3.25, 2, 0, 0.5, 4, 12, D);
  addCyl(-2, 2, -3, 0.12, 4, M, 0.2);
  addCyl(2, 2, -3, 0.12, 4, M, 0.2);
  addCyl(-2, 2, 3, 0.12, 4, M, 0.2);
  addCyl(2, 2, 3, 0.12, 4, M, 0.2);
  addWall(0, 1, -2, 6, 0.15, 0.15, D);
  addWall(0, 2.8, -2, 6, 0.15, 0.15, D);
  addWall(0, 1, 2, 6, 0.15, 0.15, D);
  addWall(0, 2.8, 2, 6, 0.15, 0.15, D);
  addBox(1, 0.5, -2, 1, 1, 1, 0x8b6914);
  addBox(-1, 0.5, 2, 1, 1, 1, 0x8b6914);
  // === LOWER PLATFORM (B site) ===
  addWall(0, -1.85, 12, 20, 0.3, 16, M);

// ===== SHOOTING =====
const raycaster = new THREE.Raycaster();
const muzzleFlashEl = document.getElementById('muzzle-flash');

function shoot() {
  if (!canShoot || ammo <= 0) return;
  canShoot = false;
  ammo--;

  // Sound
  playGunshot();

  // Muzzle flash
  muzzleFlashEl.classList.remove('fire');
  void muzzleFlashEl.offsetWidth;
  muzzleFlashEl.classList.add('fire');
  muzzleLight.intensity = 3;
  setTimeout(() => { muzzleLight.intensity = 0; }, 50);

  // Gun recoil (Three.js, not DOM)
  recoilAmount = 0.06;

  // Raycast
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObjects(sceneObjects);
  if (hits.length > 0) {
    const hit = hits[0];
    // Bullet hole effect
    const holeGeo = new THREE.CircleGeometry(0.08, 8);
    const holeMat = new THREE.MeshBasicMaterial({color:0x111111, side:THREE.DoubleSide});
    const hole = new THREE.Mesh(holeGeo, holeMat);
    hole.position.copy(hit.point);
    hole.lookAt(hit.point.clone().add(hit.face.normal));
    hole.position.add(hit.face.normal.clone().multiplyScalar(0.01));
    scene.add(hole);
    sceneObjects.push(hole);
  }

  // Fire rate cooldown
  setTimeout(() => { canShoot = true; }, 120);
}

// ===== POINTER LOCK =====
const pauseOvl = document.getElementById('pause-overlay');

function startGame() {
  clearMap();
  mapLoaders[currentMap]();
  document.querySelectorAll('.menu-overlay').forEach(m => m.classList.add('hidden'));
  document.getElementById('crosshair').style.display = 'block';
  document.getElementById('debug').style.display = 'block';
  gameStarted = true;
  ammo = maxAmmo;
  yaw = 0; pitch = 0;
  player.position.set(0, PLAYER_HEIGHT, 0);
  player.rotation.y = 0;
  pitchObj.rotation.x = 0;
  renderer.domElement.requestPointerLock();
}

document.addEventListener('mousedown', function(e) {
  if (gameStarted && isLocked && e.button === 0) {
    shoot();
  } else if (gameStarted && !isLocked) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', function() {
  isLocked = document.pointerLockElement === renderer.domElement;
  if (!isLocked && gameStarted) {
    pauseOvl.classList.remove('hidden');
  } else {
    pauseOvl.classList.add('hidden');
  }
});

// ESC = main menu
document.addEventListener('keydown', function(e) {
  if (e.code === 'Escape' && !isLocked && gameStarted) {
    gameStarted = false;
    pauseOvl.classList.add('hidden');
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('debug').style.display = 'none';
    yaw = 0; pitch = 0;
    player.position.set(0, PLAYER_HEIGHT, 0);
    player.rotation.y = 0;
    pitchObj.rotation.x = 0;
    showMenu('main-menu');
  }
});

document.addEventListener('mousemove', function(e) {
  if (!isLocked) return;
  yaw -= (e.movementX||0) * MOUSE_SENS;
  pitch -= (e.movementY||0) * MOUSE_SENS;
  pitch = Math.max(-1.55, Math.min(1.55, pitch));
  player.rotation.y = yaw;
  pitchObj.rotation.x = pitch;
});

document.addEventListener('keydown', function(e) {
  switch(e.code){case'KeyW':keys.w=true;break;case'KeyA':keys.a=true;break;case'KeyS':keys.s=true;break;case'KeyD':keys.d=true;break}
});
document.addEventListener('keyup', function(e) {
  switch(e.code){case'KeyW':keys.w=false;break;case'KeyA':keys.a=false;break;case'KeyS':keys.s=false;break;case'KeyD':keys.d=false;break}
});

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== GAME LOOP =====
const clock = new THREE.Clock();
const debugEl = document.getElementById('debug');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (isLocked) {
    // Movement
    const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const rgt = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const mv = new THREE.Vector3();
    if(keys.w) mv.add(fwd); if(keys.s) mv.sub(fwd);
    if(keys.d) mv.add(rgt); if(keys.a) mv.sub(rgt);
    if(mv.lengthSq()>0) mv.normalize();

    const moving = mv.lengthSq() > 0;
    player.position.x += mv.x * MOVE_SPEED * dt;
    player.position.z += mv.z * MOVE_SPEED * dt;

    // Gravity
    velocityY -= GRAVITY * dt;
    player.position.y += velocityY * dt;
    if(player.position.y <= PLAYER_HEIGHT) { player.position.y = PLAYER_HEIGHT; velocityY = 0; }

    // Footstep sounds
    if (moving) {
      footstepTimer -= dt;
      if (footstepTimer <= 0) {
        playFootstep();
        footstepTimer = FOOTSTEP_INTERVAL;
      }
    } else {
      footstepTimer = 0;
    }

    // Gun recoil
    if (recoilAmount > 0) {
      recoilAmount *= 0.85;
      if (recoilAmount < 0.001) recoilAmount = 0;
    }

    // Gun bob when walking
    let bobY = 0, bobX = 0;
    if (moving) {
      const bobSpeed = 10;
      const bobAmount = 0.008;
      bobY = Math.sin(clock.elapsedTime * bobSpeed) * bobAmount;
      bobX = Math.cos(clock.elapsedTime * bobSpeed * 0.5) * bobAmount * 0.5;
    }
    gunGroup.position.y = -0.22 + bobY + recoilAmount;
    gunGroup.position.x = 0.25 + bobX;

    // Debug + ammo HUD
    debugEl.innerHTML =
      'Pos: '+player.position.x.toFixed(1)+', '+player.position.y.toFixed(1)+', '+player.position.z.toFixed(1)+
      '<br>Yaw: '+(yaw*180/Math.PI).toFixed(1)+'°  Pitch: '+(pitch*180/Math.PI).toFixed(1)+'°'+
      '<br>Ammo: ' + ammo + ' / ' + maxAmmo;
  }

  renderer.render(scene, camera);
}
animate();
